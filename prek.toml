# =============================================================================
# prek git hooks
#
# 本轮变更（详见 README-APPLY）：
#   + typos 拼写门禁（远程 hook，prek 自管可执行文件，本地无需安装）
#   + detect-private-key 密钥扫描（金融红线：凭据/私钥一票否决）
#   + check-added-large-files 大文件防线（防误提交二进制/数据文件）
#   + 修复 check-toml 重复登记（原文件中同 id 出现两次）
#   + trailing-whitespace 显式 --markdown-linebreak-ext=md（对齐 .editorconfig：
#     md 行尾双空格是换行语法，不得裁剪）
#   + 结构改为 [[repos.hooks]] 数组表（等价原 inline 写法，可读性/可维护性更好）
#
# prek 原生 TOML 配置（prek >= 0.5）。
# schema 参考：https://prek.j178.dev/reference/configuration/
#
# 安装：项目根执行 `prek install`（或 `just hooks`）—— default_install_hook_types
#       使一条命令同时装好 pre-commit 与 pre-push 两个 hook。
# 手动：prek run --all-files                        （pre-commit 级）
#       prek run --hook-stage pre-push --all-files  （pre-push 级）
# 跳过（慎用，须在任务备注中说明原因）：SKIP=cargo-clippy git commit ...
#
# 门禁分级（快慢分离，避免日常提交被慢检查拖垮）：
#   pre-commit（秒级）  格式 + clippy 全量 -D warnings + typos + 文件卫生
#                       + 密钥扫描 + 大文件防线
#   pre-push（分钟级）  全量测试 + cargo-deny 依赖审计
#                       （未安装 cargo-deny 会硬阻塞推送——这是刻意的：
#                        推送门禁不降级；一次性 `cargo install cargo-deny`）
# =============================================================================

default_install_hook_types = ["pre-commit", "pre-push"]

# 全局排除：这些路径不参与任何 hook 的文件选择——
#   * .dp/（dp 任务库）入库共享（见 .gitignore 注释），但其数据格式归 dp
#     工具所有，修改型 hook（trailing-whitespace / end-of-file-fixer /
#     mixed-line-ending）不得触碰；
#   * bootstrap/fix1 的备份目录非源码。
exclude = "^(\\.dp/|\\.scaffold-backup-|\\.fix1-backup-)"

# =============================================================================
# 快门禁：pre-commit（秒级）
# =============================================================================

# --- Rust：格式 + 极严 lint ----------------------------------------------------

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt --check"
entry = "cargo fmt --all -- --check"
language = "system"
files = "\\.(rs|toml)$"
stages = ["pre-commit"]
pass_filenames = false

[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy -D warnings（极严门禁）"
entry = "cargo clippy --workspace --all-targets --quiet -- -D warnings"
language = "system"
files = "\\.(rs|toml)$"
stages = ["pre-commit"]
pass_filenames = false

# --- 拼写检查：typos（远程 hook，prek 自动管理可执行文件） ----------------------
# 注：typos 默认 hook 带 --write-changes（自动改写后失败）；门禁取向改为
# 只查不改（args 置空），改动由人工确认后提交。
# rev 跟随官方文档示例版本（docs/pre-commit.md），升级时同步更新。

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.52.0"

[[repos.hooks]]
id = "typos"
args = []
stages = ["pre-commit"]

# --- 通用文件卫生 + 金融防线（pre-commit-hooks 内置 Rust 快速实现） ------------

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.3.2"
hooks = [{ id = "rumdl-check", args = ["--fix"] }]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

[[repos.hooks]]
id = "check-case-conflict"
stages = ["pre-commit"]

[[repos.hooks]]
id = "check-executables-have-shebangs"
stages = ["pre-commit"]

[[repos.hooks]]
id = "check-shebang-scripts-are-executable"
stages = ["pre-commit"]

[[repos.hooks]]
id = "check-illegal-windows-names"
stages = ["pre-commit"]

[[repos.hooks]]
id = "check-json"
stages = ["pre-commit"]

[[repos.hooks]]
id = "check-symlinks"
stages = ["pre-commit"]

[[repos.hooks]]
id = "check-toml"
stages = ["pre-commit"]

[[repos.hooks]]
id = "check-merge-conflict"
stages = ["pre-commit"]

[[repos.hooks]]
id = "destroyed-symlinks"
stages = ["pre-commit"]

[[repos.hooks]]
id = "end-of-file-fixer"
stages = ["pre-commit"]

[[repos.hooks]]
id = "fix-byte-order-marker"
stages = ["pre-commit"]

[[repos.hooks]]
id = "forbid-new-submodules"
stages = ["pre-commit"]

[[repos.hooks]]
id = "trailing-whitespace"
# 对齐 .editorconfig：md 行尾双空格是换行语法，显式声明保留（其余文件照裁）。
args = ["--markdown-linebreak-ext=md"]
stages = ["pre-commit"]

[[repos.hooks]]
id = "no-commit-to-branch"
# 强制走分支 + 评审留痕（合规基线 §6 可审计证据链）。单人直提 main 需显式
# 跳过：SKIP=no-commit-to-branch git commit ...（须在 dp 任务备注说明原因）。
args = ["--branch=main"]
stages = ["pre-commit"]

[[repos.hooks]]
id = "mixed-line-ending"
args = ["--fix=lf"]
stages = ["pre-commit"]

[[repos.hooks]]
id = "sort-simple-yaml"
stages = ["pre-commit"]

[[repos.hooks]]
id = "detect-private-key"
# 金融红线：私钥/凭据文件一票否决（编码规范 §10 / 合规基线 §8 密钥管理）。
stages = ["pre-commit"]

[[repos.hooks]]
id = "check-added-large-files"
# 防误提交大二进制/数据文件；10MiB 上限兼顾监管 PDF 的正常尺寸
# （合规目录已有 PDF 为历史存量，hook 只检查新增文件，不受影响）。
args = ["--maxkb=10240"]
stages = ["pre-commit"]

# =============================================================================
# 慢门禁：pre-push（分钟级）
# =============================================================================

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cargo-test"
name = "cargo test --workspace"
entry = "cargo test --workspace --quiet"
language = "system"
stages = ["pre-push"]
pass_filenames = false

[[repos.hooks]]
id = "cargo-deny"
name = "cargo deny check（许可证/漏洞/来源审计）"
# 硬门禁：未安装 cargo-deny 会阻塞推送（刻意——推送审计不降级）。
# 一次性安装：cargo install cargo-deny
entry = "cargo deny check --hide-inclusion-graph"
language = "system"
stages = ["pre-push"]
pass_filenames = false
