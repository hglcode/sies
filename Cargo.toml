[workspace]
members = [
    "bins/gateway",
    "bins/node",
    "bins/verifier",
    "crates/chain",
    "crates/consensus",
    "crates/core",
    "crates/crypto",
    "crates/e2e",
    "crates/executor",
    "crates/infra",
    "crates/p2p",
    "crates/rpc",
    "crates/storage",
]
resolver = "2"

# 统一管理工作区的依赖版本和 Rust 版本
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
# 禁止 unwrap (可根据团队接受度调整为 warn)
unwrap_used = "deny"
# 强制要求 default-features = false 很难用 lint 自动检查，需人工 review
default-features = false

# 开启更严格的检查
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

# 在这里统一管理依赖，子 crate 中可以使用 { workspace = true } 引入
[workspace.dependencies]
approx = "0"
anyhow = "1"
crc32fast = "1"
figment = "0"
hex = "0"
postcard = { version = "1", default-features = false, features = ["alloc"] }
rand = "0"
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sies-infra = { path = "crates/infra" }
tempfile = "3"
thiserror = "2"
tokio = "1"
tracing = "0"
tracing-subscriber = "0"
