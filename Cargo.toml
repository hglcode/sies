[workspace]
resolver = "3"
members = [
    "bins/gateway",
    "bins/node",
    "bins/standalone",
    "bins/verifier",
    "crates/chain",
    "crates/consensus",
    "crates/core",
    "crates/crypto",
    "crates/e2e",
    "crates/executor",
    "crates/infra",
    "crates/p2p",
    "crates/rpc",
    "crates/standalone",
    "crates/storage",
]

# 统一管理工作区的依赖版本和 Rust 版本
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
# 强制要求 default_features = false 很难用 lint 自动检查，需人工 review
# default_features = false

# 警告使用 unwrap 和 expect (生产代码应使用 ? 或 handle error)
unwrap_used = "warn"
expect_used = "warn"
# 警告在 panic 宏中硬编码错误信息
panic = "warn"

# 提升代码质量的常用 lints
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

# 在这里统一管理依赖，子 crate 中可以使用 { workspace = true } 引入
[workspace.dependencies]
anyhow = "1"
approx = "0"
clap = { version = "4", default-features = false, features = ["derive", "std"] }
crc32fast = "1"
ed25519-dalek = { version = "3", default-features = false, features = [
    "fast",
    "zeroize",
] }
figment = "0"
hex = { version = "0", default-features = false, features = ["alloc"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
rand = "0"
rand_core = { version = "0.10", default-features = false }
rust_decimal = "1"
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
sies-infra = { path = "crates/infra" }
sies-standalone = { path = "crates/standalone" }
tempfile = "3"
thiserror = "2"
tokio = "1"
tracing = "0"
tracing-subscriber = "0"
