[workspace]
members = [
  "bins/api",
  "bins/node",
  "bins/verifier",
  "crates/chain",
  "crates/consensus",
  "crates/core",
  "crates/crypto",
  "crates/executor",
  "crates/infra",
  "crates/p2p",
  "crates/rpc",
  "crates/storage",
]
resolver = "2"

# 统一管理工作区的依赖版本和 Rust 版本
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
figment = "0"
rand = "0"
# 在这里统一管理依赖，子 crate 中可以使用 { workspace = true } 引入
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0"
tracing-subscriber = "0"
