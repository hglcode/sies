syntax = "proto3";
package sies.v1;

import "v1/common.proto";

// 统一的 `Verifier` 服务，面向核心演化算法的状态提交
service NodeVerifierService {
  // 统一提交节点的状态向量（无论是连续的预测还是离散的投票）
  // `Verifier` 负责验证该向量的合法性（如范围、签名、承诺）并返回可信签名
  rpc CommitState(CommitStateRequest) returns (CommitStateResponse);
}

message CommitStateRequest {
  bytes node_id = 1;        // 提交者 ID (Predictor 或 Voter)
  uint64 round = 2;         // 当前演化轮次/共识轮次

  // 核心：统一的状态向量
  // 在 Predict 阶段，它是 [0, 1] 的连续浮点数（通过 `BeliefVector` 传递）
  // 在 Vote 阶段，它是 {0, 1} 的离散值（同样可以通过 `BeliefVector` 传递，或应用层做离散化校验）
  BeliefVector state_vector = 3;

  // 可选：如果需要在协议层显式区分阶段（通常建议由 round 的类型或应用层上下文决定）
  // Phase phase = 4;
}

message CommitStateResponse {
  bool accepted = 1;
  string rejection_reason = 2; // 如果 rejected，说明原因（如超出 [0,1] 范围、签名无效等）
  bytes signature = 3;         // `Verifier` 对该 `state_vector` 的可信签名
}
