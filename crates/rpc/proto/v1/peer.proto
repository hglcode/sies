syntax = "proto3";
package sies.v1;

import "v1/common.proto";

// 对等节点间的控制面与账本同步
service PeerService {
  // 增量同步账本：半开区间 [from_seq, to_seq)，to_seq = 0 表示同步至最新。
  // 直接流式返回 LedgerEntry（v1 冻结前的 Event/StateCommitment 已并入，
  // 认证信息由 LedgerEntry.auth 承载）
  rpc SyncEventLog(SyncEventLogRequest) returns (stream LedgerEntry);
  // 广播共识决策结果（具体方案由 #49 共识 ADR 冻结）
  rpc BroadcastDecision(DecisionEvent) returns (Ack);
}

message SyncEventLogRequest {
  uint64 from_seq = 1;  // 起始序号（含）
  uint64 to_seq = 2;    // 结束序号（排他）；0 = 至最新
}

// 决策事件：聚合后的全局信念/共识向量
message DecisionEvent {
  uint64 round = 1;
  PeerId proposer = 2;
  BeliefVector consensus_vector = 3;  // 10^18 定点
  // 提议者/阈值签名证明（方案待 #49 冻结，暂保留原始字节）
  bytes signature = 4;
}

message Ack {
  bool success = 1;
  // 失败原因（统一错误模型）
  ErrorDetail error = 2;
}
